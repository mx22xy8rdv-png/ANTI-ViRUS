name: Build KiwiAV

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify syntax
        run: python -c "import ast; ast.parse(open('antivirus.py', encoding='utf-8').read())"

      - name: Build EXE
        run: |
          pyinstaller --noconsole --onefile --name KiwiAV antivirus.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KiwiAV-exe
          path: dist/KiwiAV.exe
